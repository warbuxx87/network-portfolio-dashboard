<div class="m-portlet m-portlet--creative m-portlet--first m-portlet--bordered-semi">
  <div class="m-portlet__head">
    <div class="m-portlet__head-caption">
      <div class="m-portlet__head-title">
        <h3 class="m-portlet__head-text">
          Volume Weighted Average Price
        </h3>
        <h2 class="m-portlet__head-label m-portlet__head-label--brand">
					<span>Bitcoin Price</span>
				</h2>
      </div>
    </div>
  </div>
  <div class="m-portlet__body">
    <div class="m-widget25">
      <span ng-bind="btc.idx | currency:'$':2" class="m-widget25__price m--font-total">
        Loading ...
      </span>
      <div class="m-separator m-separator--space m-separator--dashed m-separator--lg"></div>
      <div class="table-responsive m-scrollable mCustomScrollbar _mCS_3 mCS-autoHide" data-scrollbar-shown="true" data-scrollable="true" data-max-height="250">
        <table class="table table-striped m-table m-table--head-bg-brand">
          <thead>
            <tr>
              <th>Exchange</th>
              <th>Bid</th>
              <th>Ask</th>
              <th>Volume</th>
            </tr>
          </thead>
          <tbody>
            <tr data-ng-repeat="market in btc.markets">
              <td>{{ market.name }}</td>
              <td>{{ market.bid | currency:"$":2 }}</td>
              <td>{{ market.ask | currency:"$":2 }}</td>
              <td>{{ market.volume | number:2 }} </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
