	<script type="text/javascript">
            var tradesCount        = 0,
                ordersCount        = 0,
                trades_output      = document.getElementById('m_datatable_bots');

            websocket = new WebSocket('wss://ws.quadrigacx.com');
            websocket.onopen = function() {
                websocket.send(JSON.stringify({ action: 'subscribe', book: 'btc_cad', type: 'trades' }));

            };

            websocket.onmessage = function(message){
                var data = JSON.parse(message.data);

                if (data.type != 'ka')
                    console.log(data); // useful to show what we are receiving

                if (data.type == 'trades' && data.payload) {
                    if (tradesCount == 0)
                        trades_output.innerHTML = '';

                    tradesCount++;

                    for (var i in data.payload) {
                        var trade = data.payload[i];

                        var child = document.createElement("div");
                        child.innerHTML = '[' + trade['i'] + '] ' + trade['a'] + ' BTC @ ' + trade['r'] + ' CAD = ' + trade['v'] + ' CAD';
                        trades_output.appendChild(child);
                    }
                }
            };
        </script>
